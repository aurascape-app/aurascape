<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraScape AI - Ultra 4K Wallpapers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0c10; color: #e0e6ed; }
    .glass-card { background: rgba(20, 22, 31, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .gradient-text { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen pb-16">

  <header class="border-b border-gray-800/80 sticky top-0 z-40 bg-[#0b0c10]/90 backdrop-blur-md">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-500 to-pink-500 flex items-center justify-center font-extrabold text-white text-xl">A</div>
        <div>
          <h1 class="font-bold text-lg leading-none gradient-text">AuraScape AI</h1>
          <p class="text-[10px] text-gray-400 font-medium">FLUX Powered • Anime & Faith Wallpapers</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

    <div class="glass-card rounded-2xl p-5 md:p-7 space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
          Describe Your Idea (Be specific!)
        </label>
        <textarea 
          id="promptInput"
          rows="3" 
          class="w-full bg-gray-950/80 border border-gray-800 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition"
          placeholder="e.g. Naruto in Sage of Six Paths mode, back turned at an angle, standing sad in dark flooded Kurama cage with rippling water..."
        ></textarea>
      </div>

      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-gray-300 uppercase tracking-wider">Format:</label>
        <select id="aspectRatio" class="bg-gray-900 border border-gray-800 text-white text-xs font-semibold rounded-lg px-3 py-2">
          <option value="9:16">📱 Mobile Lockscreen (1080x1920)</option>
          <option value="16:9">💻 Desktop Wallpaper (1920x1080)</option>
        </select>
      </div>

      <button 
        id="generateBtn"
        onclick="generateUltraImage()"
        class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white py-3.5 px-6 rounded-xl font-bold text-sm hover:opacity-95 transition shadow-lg"
      >
        <span>⚡ Generate FLUX 4K Artwork</span>
      </button>
    </div>

    <div id="outputArea" class="hidden glass-card rounded-2xl p-5 md:p-7 space-y-5 border border-indigo-500/30">
      <div class="flex items-center justify-between border-b border-gray-800 pb-3">
        <h3 class="font-bold text-white text-base">Generated FLUX Artwork</h3>
      </div>

      <div class="relative rounded-xl overflow-hidden bg-black flex items-center justify-center min-h-[350px]">
        <img id="resultImg" src="" alt="AI Wallpaper" class="max-h-[550px] w-auto object-contain" />
      </div>

      <a id="downloadLink" href="#" target="_blank" download="wallpaper.jpg" class="block w-full">
        <button class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs">
          ⬇️ Download Full Resolution
        </button>
      </a>
    </div>

  </main>

  <script>
    function generateUltraImage() {
      const userPrompt = document.getElementById('promptInput').value.trim();
      if (!userPrompt) {
        alert('Please enter a concept first!');
        return;
      }

      const generateBtn = document.getElementById('generateBtn');
      const outputArea = document.getElementById('outputArea');
      const resultImg = document.getElementById('resultImg');
      const downloadLink = document.getElementById('downloadLink');
      const aspectRatio = document.getElementById('aspectRatio').value;

      const width = aspectRatio === '9:16' ? 1080 : 1920;
      const height = aspectRatio === '9:16' ? 1920 : 1080;

      // PROMPT ENHANCER: Secretly converts simple user text into an ultra-detailed art prompt
      const enhancedPrompt = `Masterpiece cinematic anime artwork, highly detailed, dramatic emotional lighting, volumetric dark shadows, intricate details, 8k resolution, ${userPrompt}, trending on artstation, octane render style`;
      const encodedPrompt = encodeURIComponent(enhancedPrompt);
      const seed = Math.floor(Math.random() * 9999999);

      // FLUX Model Engine API call
      const generatedUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&model=flux&nologo=true`;

      generateBtn.disabled = true;
      generateBtn.innerHTML = '<span>⚡ Rendering FLUX Artwork... (Takes ~10 seconds)</span>';

      const imgLoader = new Image();
      imgLoader.src = generatedUrl;
      imgLoader.onload = () => {
        resultImg.src = generatedUrl;
        downloadLink.href = generatedUrl;
        outputArea.classList.remove('hidden');
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<span>⚡ Generate FLUX 4K Artwork</span>';
        outputArea.scrollIntoView({ behavior: 'smooth' });
      };

      imgLoader.onerror = () => {
        alert('Render took too long. Please tap generate again!');
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<span>⚡ Generate FLUX 4K Artwork</span>';
      };
    }
  </script>
</body>
</html>
