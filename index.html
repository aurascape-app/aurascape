<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraScape AI - Multi-Engine Ensemble</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0c10; color: #e0e6ed; }
    .glass-card { background: rgba(20, 22, 31, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .gradient-text { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- Header -->
  <header class="border-b border-gray-800/80 sticky top-0 z-40 bg-[#0b0c10]/90 backdrop-blur-md">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-500 to-pink-500 flex items-center justify-center font-extrabold text-white text-xl">A</div>
        <div>
          <h1 class="font-bold text-lg leading-none gradient-text">AuraScape AI</h1>
          <p class="text-[10px] text-gray-400 font-medium">Multi-Engine AI Pipeline • FLUX + Animagine</p>
        </div>
      </div>
      <span class="text-xs bg-indigo-500/10 text-indigo-400 px-3 py-1 rounded-full border border-indigo-500/20 font-semibold">
        ✨ Smart AI Ensemble Active
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

    <div class="glass-card rounded-2xl p-5 md:p-7 space-y-5">
      
      <!-- Engine Selector -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">Engine Mode:</label>
          <select id="engineMode" class="w-full bg-gray-950 border border-gray-800 text-white text-xs font-semibold rounded-xl p-3 focus:outline-none focus:border-indigo-500">
            <option value="auto">🤖 Auto-Detect (AI Router Pick)</option>
            <option value="animagine">🎌 Animagine XL 3.1 (Anime Lore)</option>
            <option value="flux">⚡ FLUX.1 (Cinematic & Faith)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">Format:</label>
          <select id="aspectRatio" class="w-full bg-gray-950 border border-gray-800 text-white text-xs font-semibold rounded-xl p-3 focus:outline-none focus:border-indigo-500">
            <option value="9:16">📱 Mobile Lockscreen (1080x1920)</option>
            <option value="16:9">💻 Desktop Wallpaper (1920x1080)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-indigo-400 uppercase tracking-wider mb-1">HuggingFace Token (Optional):</label>
          <input type="password" id="hfToken" placeholder="hf_... (For Animagine XL)" class="w-full bg-gray-950 border border-gray-800 text-white text-xs rounded-xl p-3 focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <!-- Prompt Input -->
      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
          Describe Your Vision
        </label>
        <textarea 
          id="promptInput"
          rows="3" 
          class="w-full bg-gray-950/80 border border-gray-800 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition"
          placeholder="e.g. Naruto Uzumaki standing inside Kurama's dark cage, glowing Sage mode cloak, water ripples..."
        ></textarea>
      </div>

      <button 
        id="generateBtn"
        onclick="runMultiEnginePipeline()"
        class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white py-3.5 px-6 rounded-xl font-bold text-sm hover:opacity-95 transition shadow-lg"
      >
        <span>⚡ Generate HD Artwork (Ensemble Pipeline)</span>
      </button>

    </div>

    <!-- Output Showcase -->
    <div id="outputArea" class="hidden glass-card rounded-2xl p-5 md:p-7 space-y-5 border border-indigo-500/30">
      <div class="flex items-center justify-between border-b border-gray-800 pb-3">
        <h3 class="font-bold text-white text-base">Pipeline Render Output</h3>
        <span id="activeEngineBadge" class="text-xs text-indigo-400 bg-indigo-950 px-2.5 py-1 rounded-md border border-indigo-800 font-medium">Engine: Auto</span>
      </div>

      <div class="relative rounded-xl overflow-hidden bg-black flex items-center justify-center min-h-[350px]">
        <img id="resultImg" src="" alt="AI Artwork" class="max-h-[550px] w-auto object-contain" />
      </div>

      <a id="downloadLink" href="#" target="_blank" download="aurascape-hd-wallpaper.png" class="block w-full">
        <button class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs">
          ⬇️ Download Full Resolution HD Image
        </button>
      </a>
    </div>

  </main>

  <script>
    async function runMultiEnginePipeline() {
      const userPrompt = document.getElementById('promptInput').value.trim();
      let mode = document.getElementById('engineMode').value;
      const hfToken = document.getElementById('hfToken').value.trim();
      const aspectRatio = document.getElementById('aspectRatio').value;

      if (!userPrompt) {
        alert('Please enter a description first!');
        return;
      }

      const generateBtn = document.getElementById('generateBtn');
      const outputArea = document.getElementById('outputArea');
      const resultImg = document.getElementById('resultImg');
      const downloadLink = document.getElementById('downloadLink');
      const activeEngineBadge = document.getElementById('activeEngineBadge');

      const width = aspectRatio === '9:16' ? 1080 : 1920;
      const height = aspectRatio === '9:16' ? 1920 : 1080;

      // 1. STAGE 1: SMART ROUTER
      const animeKeywords = ['naruto', 'goku', 'gojo', 'anime', 'manga', 'sasuke', 'luffy', 'demon slayer', 'solo leveling', 'kakashi'];
      const isAnimePrompt = animeKeywords.some(keyword => userPrompt.toLowerCase().includes(keyword));

      if (mode === 'auto') {
        mode = (isAnimePrompt && hfToken) ? 'animagine' : 'flux';
      }

      generateBtn.disabled = true;
      generateBtn.innerHTML = `<span>⚡ Processing via ${mode.toUpperCase()} Engine...</span>`;

      // 2. STAGE 2: EXECUTE SPECIFIC MODEL PIPELINE
      if (mode === 'animagine' && hfToken) {
        // ANIMAGINE XL PIPELINE
        activeEngineBadge.innerText = 'Engine: Animagine XL 3.1 (Anime Specialist)';
        const positivePrompt = `masterpiece, high score, great score, ultra-detailed, 1boy, ${userPrompt}, cinematic lighting, 8k wallpaper`;
        const negativePrompt = `lowscore, bad score, worst quality, low quality, bad anatomy, deformed, bad hands, blurry`;

        try {
          const response = await fetch(
            "https://api-inference.huggingface.co/models/cagliostrolab/animagine-xl-3.1",
            {
              headers: { Authorization: `Bearer ${hfToken}` },
              method: "POST",
              body: JSON.stringify({
                inputs: positivePrompt,
                parameters: { negative_prompt: negativePrompt, width: 832, height: 1216 }
              }),
            }
          );

          if (!response.ok) throw new Error('HF Model response busy. Falling back to FLUX engine...');

          const blob = await response.blob();
          const imageUrl = URL.createObjectURL(blob);
          renderOutput(imageUrl);

        } catch (err) {
          // Automatic Failover to FLUX if HF is busy
          renderFlux(userPrompt, width, height);
        }

      } else {
        // FLUX.1 PIPELINE
        activeEngineBadge.innerText = 'Engine: FLUX.1 (Cinematic & Faith)';
        renderFlux(userPrompt, width, height);
      }

      function renderFlux(promptText, w, h) {
        const enhancedPrompt = `Masterpiece cinematic digital art, ultra high resolution, hyper detailed, dramatic atmospheric lighting, ${promptText}, octane render 8k style`;
        const encoded = encodeURIComponent(enhancedPrompt);
        const seed = Math.floor(Math.random() * 9999999);
        const fluxUrl = `https://image.pollinations.ai/prompt/${encoded}?width=${w}&height=${h}&seed=${seed}&model=flux&nologo=true`;

        const imgLoader = new Image();
        imgLoader.src = fluxUrl;
        imgLoader.onload = () => renderOutput(fluxUrl);
        imgLoader.onerror = () => {
          alert('Render error. Please try generating again.');
          resetBtn();
        };
      }

      function renderOutput(url) {
        resultImg.src = url;
        downloadLink.href = url;
        outputArea.classList.remove('hidden');
        outputArea.scrollIntoView({ behavior: 'smooth' });
        resetBtn();
      }

      function resetBtn() {
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<span>⚡ Generate HD Artwork (Ensemble Pipeline)</span>';
      }
    }
  </script>
</body>
</html>
