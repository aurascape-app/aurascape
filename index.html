<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurascape</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; background: #050505; color: #fff; overflow: hidden; }
    .font-syne { font-family: 'Syne', sans-serif; }
    .glass-modal { background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); }
  </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-between p-6">

  <!-- TOP BAR -->
  <header class="flex justify-between items-center z-10">
    <h1 class="text-xl font-syne font-extrabold tracking-wider bg-gradient-to-r from-amber-200 to-amber-500 bg-clip-text text-transparent">AURASCAPE</h1>
    <button onclick="openPaywall()" class="px-4 py-2 rounded-full bg-amber-400/10 border border-amber-400/30 text-amber-300 font-semibold text-sm hover:bg-amber-400/20 transition cursor-pointer">✨ Aura Pro</button>
  </header>

  <!-- CENTER DISPLAY -->
  <main class="absolute inset-0 flex items-center justify-center pointer-events-none">
    <div class="text-center">
      <h2 id="activeCanvasTitle" class="text-3xl font-syne font-bold text-slate-200 mb-2">Silky Waves</h2>
      <p class="text-xs text-slate-400">Select a canvas style below</p>
    </div>
  </main>

  <!-- BOTTOM CANVAS SELECTOR BAR -->
  <nav class="relative z-10 flex gap-2 overflow-x-auto pb-2 max-w-3xl mx-auto w-full no-scrollbar">
    <button onclick="switchCanvas('Silky Waves', false)" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-sm whitespace-nowrap cursor-pointer">Silky Waves</button>
    <button onclick="switchCanvas('Plasma Lightning', false)" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-sm whitespace-nowrap cursor-pointer">Plasma Lightning</button>
    <button onclick="switchCanvas('Volumetric Smoke', false)" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-sm whitespace-nowrap cursor-pointer">Volumetric Smoke</button>
    <button onclick="switchCanvas('⚡ High-Voltage Lightning', true)" class="px-4 py-2 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 hover:bg-amber-500/20 text-sm whitespace-nowrap cursor-pointer">⚡ High-Voltage Lightning (Pro)</button>
    <button onclick="switchCanvas('Neon Aurora', false)" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-sm whitespace-nowrap cursor-pointer">Neon Aurora</button>
    <button onclick="switchCanvas('Quantum Matrix', false)" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-sm whitespace-nowrap cursor-pointer">Quantum Matrix</button>
  </nav>

  <!-- PRO PAYWALL MODAL -->
  <div id="paywallModal" class="absolute inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-md opacity-0 transition-opacity duration-300 flex">
    <div class="glass-modal w-full max-w-sm rounded-3xl p-6 relative border border-amber-500/20 shadow-2xl scale-95 transition-transform duration-300" id="paywallCard">
      <button onclick="closePaywall()" class="absolute top-4 right-4 text-slate-400 hover:text-white cursor-pointer">✕</button>
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-xl mb-4 shadow-lg shadow-amber-500/30">⚡</div>
      <h2 class="text-2xl font-syne font-extrabold text-white mb-2">Unlock AURA PRO</h2>
      <p class="text-sm text-slate-300 mb-6">Gain instant access to our ultra-detailed High-Voltage Electricity engine, volumetric smoke, and all pro canvases.</p>
      <button onclick="handleSubscribe()" class="w-full py-3 rounded-xl bg-amber-400 text-black font-bold font-syne hover:bg-amber-300 transition cursor-pointer">Subscribe Now ($4.99/mo)</button>
      <p class="text-center text-[10px] text-slate-500 mt-4">Instant billing for 1 full month. Cancel anytime.</p>
    </div>
  </div>

  <script>
    const LEMON_SQUEEZY_URL = "https://aurascape.lemonsqueezy.com/checkout/buy/7ac4533f-f0a6-421b-ac83-89c345f6fa50";

    function switchCanvas(name, isPro) {
      if (isPro) {
        openPaywall();
        return;
      }
      document.getElementById('activeCanvasTitle').innerText = name;
    }

    function openPaywall() {
      const modal = document.getElementById('paywallModal');
      const card = document.getElementById('paywallCard');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        card.classList.remove('scale-95');
      }, 10);
    }

    function closePaywall() {
      const modal = document.getElementById('paywallModal');
      const card = document.getElementById('paywallCard');
      modal.classList.add('opacity-0');
      card.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    function handleSubscribe() {
      window.location.href = LEMON_SQUEEZY_URL;
    }
  </script>
</body>
</html>
