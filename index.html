  <script>
    const vertexShader = `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
    `;

    const fragmentShader = `
      precision mediump float;
      uniform vec2 u_resolution;
      uniform vec2 u_mouse;
      uniform float u_time;
      uniform float u_speed;
      uniform float u_glow;
      uniform float u_audioLevel;
      uniform float u_mode; 
      uniform vec3 u_colorA;
      uniform vec3 u_colorB;
      uniform vec3 u_colorC;

      varying vec2 vUv;

      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        f = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
      }

      void main() {
        vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        vec2 mouse = (u_mouse - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        
        float t = u_time * u_speed * (0.3 + u_audioLevel * 1.2); 
        float activeGlow = u_glow * (1.0 + u_audioLevel * 2.5);
        vec3 finalColor = u_colorA;

        if (u_mode < 0.5) {
          float dist = length(st - mouse);
          st += normalize(st - mouse + 0.0001) * smoothstep(0.5, 0.0, dist) * 0.2;
          vec2 c = st * 5.5; float v = 0.0;
          for(int i = 1; i < 4; i++) {
            float fi = float(i);
            c += vec2(sin(fi * c.y + t * 0.8), cos(fi * c.x - t * 0.8));
            v += sin(c.x + c.y) / fi;
          }
          v = abs(v);
          float specular = pow(v, 3.0) * (activeGlow * 0.5);
          vec3 waveColor = mix(u_colorB, u_colorC, sin(v * 3.1415) * 0.5 + 0.5);
          finalColor = mix(u_colorA, waveColor + vec3(specular), pow(1.0 - v, 1.6) * 0.9);
        } else if (u_mode > 0.5 && u_mode < 1.5) {
          float totalBolt = 0.0;
          for(int b = 0; b < 4; b++) {
            float fb = float(b);
            vec2 p = st * 3.0 + vec2(sin(fb + t * 0.5), cos(fb * 0.5 - t * 0.3));
            float n = noise(p * 4.0 + t * 3.0 + fb);
            p += normalize(st - mouse + 0.0001) * smoothstep(0.6, 0.0, length(st - mouse)) * 0.3;
            float bolt = abs(p.x + sin(p.y * 5.0 + t * 4.0) * 0.4 + (n - 0.5) * 0.75);
            totalBolt += pow(0.012 / (bolt + 0.001), 1.3);
          }
          finalColor = u_colorA + mix(u_colorB, u_colorC, noise(st * 2.0)) * (totalBolt * (activeGlow * 0.3));
        } else {
          vec2 q = st * 2.5;
          float f = noise(q + vec2(t * 0.2, t * 0.1)) + 0.5 * noise(q * 2.0 - vec2(t * 0.3));
          f += smoothstep(0.4, 0.0, length(st - mouse)) * 0.6;
          finalColor = mix(u_colorA, u_colorB, clamp(f * f * 1.5, 0.0, 1.0)) + u_colorC * (pow(f, 3.0) * (activeGlow * 0.3));
        }

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    let scene, camera, renderer, material, mesh, uniforms;
    let targetMouse = new THREE.Vector2(0, 0), currentMouse = new THREE.Vector2(0, 0);
    let audioContext, analyser, microphone, dataArray, isAudioActive = false;
    let is24HourFormat = true;

    function initEngine() {
      try {
        const canvas = document.getElementById('webglCanvas');
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        uniforms = {
          u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
          u_mouse: { value: new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2) },
          u_time: { value: 0.0 }, u_speed: { value: 1.0 }, u_glow: { value: 2.0 },
          u_audioLevel: { value: 0.0 }, u_mode: { value: 0.0 }, 
          u_colorA: { value: new THREE.Color('#000000') }, 
          u_colorB: { value: new THREE.Color('#ffffff') }, 
          u_colorC: { value: new THREE.Color('#e2e8f0') }
        };

        material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
        mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(mesh);

        renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);

        window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight); });
        window.addEventListener('pointermove', e => { targetMouse.x = e.clientX; targetMouse.y = window.innerHeight - e.clientY; });

        setInterval(updateWidgets, 1000); 
        updateWidgets();
        animate(0);
      } catch (err) { alert("ENGINE ERROR: " + err.message); }
    }

    function animate(timestamp) {
      requestAnimationFrame(animate);
      currentMouse.x += (targetMouse.x - currentMouse.x) * 0.1;
      currentMouse.y += (targetMouse.y - currentMouse.y) * 0.1;
      uniforms.u_mouse.value.set(currentMouse.x, currentMouse.y);
      uniforms.u_time.value = timestamp * 0.001;

      if (isAudioActive && analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0; for(let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
        let audioLevel = (sum / dataArray.length) / 255.0;
        uniforms.u_audioLevel.value += (audioLevel - uniforms.u_audioLevel.value) * 0.2;
      }

      renderer.render(scene, camera);
    }

    function applyPreset(name) {
      const presets = {
        whiteVoidDark:   { mode: 0.0, a: '#000000', b: '#ffffff', c: '#f1f5f9' },
        goldDark:        { mode: 0.0, a: '#000000', b: '#eab308', c: '#fef08a' },
        oceanDeep:       { mode: 0.0, a: '#000000', b: '#06b6d4', c: '#1e3a8a' },
        crimsonBlood:    { mode: 0.0, a: '#000000', b: '#ef4444', c: '#7f1d1d' },
        multiLightning:  { mode: 1.0, a: '#000000', b: '#38bdf8', c: '#ffffff' },
        purpleLightning: { mode: 1.0, a: '#000000', b: '#c084fc', c: '#d8b4fe' },
        goldLightning:   { mode: 1.0, a: '#000000', b: '#facc15', c: '#ffffff' },
        matrixLightning: { mode: 1.0, a: '#000000', b: '#4ade80', c: '#bbf7d0' },
        silkSmoke:       { mode: 2.0, a: '#000000', b: '#c084fc', c: '#f472b6' },
        toxicSmoke:      { mode: 2.0, a: '#000000', b: '#a3e635', c: '#fef08a' },
        ghostSmoke:      { mode: 2.0, a: '#000000', b: '#94a3b8', c: '#f8fafc' },
        fireSmoke:       { mode: 2.0, a: '#000000', b: '#f97316', c: '#ef4444' }
      };
      const p = presets[name];
      if (p) {
        uniforms.u_mode.value = p.mode;
        uniforms.u_colorA.value.set(p.a); uniforms.u_colorB.value.set(p.b); uniforms.u_colorC.value.set(p.c);
      }
    }

    function updateUniforms() {
      uniforms.u_speed.value = parseFloat(document.getElementById('sliderSpeed').value);
      uniforms.u_glow.value = parseFloat(document.getElementById('sliderGlow').value);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => { el.classList.remove('bg-amber-400', 'text-black', 'font-bold'); el.classList.add('text-slate-400'); });
      document.getElementById('tabContent-' + tab).classList.remove('hidden');
      const active = document.getElementById('tabBtn-' + tab);
      active.classList.add('bg-amber-400', 'text-black', 'font-bold'); active.classList.remove('text-slate-400');
    }

    function setFont(fontClass) {
      const clock = document.getElementById('lockscreenClock');
      clock.className = `text-7xl sm:text-9xl font-extralight tracking-tight text-white drop-shadow-2xl ${fontClass}`;
    }

    function toggleTimeFormat() {
      is24HourFormat = !is24HourFormat;
      document.getElementById('timeFormatBtn').innerText = is24HourFormat ? "24H" : "12H";
      updateWidgets();
    }

    function toggleOverlay() { document.getElementById('lockscreenOverlay').classList.toggle('opacity-0'); }
    
    function updateWidgets() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      
      if (!is24HourFormat) {
        hours = hours % 12 || 12;
      }
      document.getElementById('lockscreenClock').innerText = `${String(hours).padStart(2, '0')}:${minutes}`;
      
      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('lockscreenDate').innerText = now.toLocaleDateString('en-US', options).toUpperCase();
    }

    async function toggleAudioSync() {
      const btn = document.getElementById('audioBtn');
      if (isAudioActive) {
        isAudioActive = false;
        if(microphone) microphone.disconnect();
        uniforms.u_audioLevel.value = 0.0;
        btn.classList.remove('bg-amber-500/20', 'border-amber-500/50', 'text-amber-300');
        btn.classList.add('bg-white/5', 'border-white/10', 'text-slate-300');
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 64;
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          microphone = audioContext.createMediaStreamSource(stream);
          microphone.connect(analyser);
          isAudioActive = true;
          btn.classList.add('bg-amber-500/20', 'border-amber-500/50', 'text-amber-300');
          btn.classList.remove('bg-white/5', 'border-white/10', 'text-slate-300');
        } catch (err) {
          alert("Microphone security restriction: Browsers block local mic access without HTTPS.");
        }
      }
    }

    function openPaywall() {
      const modal = document.getElementById('paywallModal');
      const card = document.getElementById('paywallCard');
      modal.classList.remove('hidden');
      setTimeout(() => { modal.classList.remove('opacity-0'); card.classList.remove('scale-95'); }, 10);
    }
    function closePaywall() {
      const modal = document.getElementById('paywallModal');
      const card = document.getElementById('paywallCard');
      modal.classList.add('opacity-0'); card.classList.add('scale-95');
      setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    window.onload = initEngine;
  </script>
</body>
</html>
