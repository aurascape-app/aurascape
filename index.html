<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA PRO • High-End Dynamic Canvas Engine</title>

  <!-- Setup Tailwind BEFORE loading the script -->
  <script>
    window.tailwind = {
      config: {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              syne: ['Syne', 'sans-serif'],
              playfair: ['Playfair Display', 'serif'],
              cinzel: ['Cinzel', 'serif'],
              space: ['Space Grotesk', 'sans-serif'],
              outfit: ['Outfit', 'sans-serif'],
              mono: ['Space Mono', 'monospace'],
            }
          }
        }
      }
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; padding: 0; overflow: hidden; background-color: #000000 !important; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; touch-action: none; width: 100vw; height: 100vh; }
    
    .edge-vignette { pointer-events: none; box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.95); border: 1px solid rgba(255, 255, 255, 0.05); }
    .glass-card { background: rgba(8, 8, 12, 0.82); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .glass-modal { background: rgba(4, 4, 6, 0.94); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.15); }
    .privacy-blurred { filter: blur(8px) contrast(1.2); opacity: 0.5; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .privacy-revealed { filter: blur(0px) contrast(1.0); opacity: 1.0; }

    input[type=range] { -webkit-appearance: none; background: rgba(255, 255, 255, 0.15); height: 4px; border-radius: 99px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #fbbf24; cursor: pointer; box-shadow: 0 0 12px rgba(251, 191, 36, 0.8); }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 99px; }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden text-slate-100 bg-black">

  <div class="absolute inset-0 z-20 edge-vignette pointer-events-none"></div>

  <!-- INLINE STYLES ADDED TO CANVAS AS FAILSAFE -->
  <canvas id="webglCanvas" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing bg-black" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 0;"></canvas>

  <header class="absolute top-0 left-0 right-0 z-30 glass-card px-4 sm:px-6 py-3 flex justify-between items-center pointer-events-auto border-b border-white/10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 text-black flex items-center justify-center font-extrabold text-xs font-syne shadow-lg shadow-amber-500/20">A</div>
      <div class="flex items-center gap-2">
        <h1 class="font-syne font-extrabold text-sm tracking-widest text-white uppercase">AURA PRO</h1>
        <span class="bg-amber-400/20 text-amber-300 font-mono text-[9px] px-2 py-0.5 rounded border border-amber-400/30 uppercase tracking-widest">STUDIO</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleAudioSync()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-white/5 border border-white/10 text-slate-300 hover:text-white transition flex items-center gap-1.5 cursor-pointer">
        <span id="micIcon">🎙️</span><span id="micText" class="hidden sm:inline">Audio Sync</span>
      </button>
      <button onclick="openPaywallModal()" class="bg-gradient-to-r from-amber-400 to-amber-600 text-black font-extrabold px-4 py-1.5 rounded-xl text-xs hover:brightness-110 transition shadow-lg shadow-amber-500/20 font-syne cursor-pointer">
        ⚡ PRO
      </button>
    </div>
  </header>

  <div id="lockscreenOverlay" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-6 pt-24 pb-36 font-syne transition-opacity duration-300">
    <div class="text-center space-y-1 my-auto">
      <p class="text-xs font-semibold tracking-[0.3em] uppercase text-amber-300/90">AURA ENGINE</p>
      <h1 id="lockscreenClock" class="text-7xl sm:text-9xl font-extralight tracking-tight text-white drop-shadow-2xl">00:00</h1>
      <p class="text-[10px] tracking-[0.3em] text-slate-400 uppercase">DYNAMIC INTERACTIVE CANVAS</p>
    </div>
  </div>

  <div id="controlPanel" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-30 w-[94%] max-w-2xl glass-card rounded-3xl p-4 shadow-2xl space-y-3 pointer-events-auto border border-white/15">
    <div class="flex items-center justify-between border-b border-white/10 pb-2">
      <div class="flex gap-2">
        <button onclick="switchTab('presets')" id="tabBtn-presets" class="tab-btn px-3 py-1 rounded-xl text-xs font-bold bg-amber-400 text-black transition cursor-pointer">Presets</button>
        <button onclick="switchTab('optics')" id="tabBtn-optics" class="tab-btn px-3 py-1 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition cursor-pointer">Optics</button>
      </div>
      <button onclick="toggleOverlay()" class="px-2.5 py-1 rounded-xl text-xs bg-white/5 border border-white/10 hover:bg-white/10 text-slate-300 transition cursor-pointer">👁️ Toggle UI</button>
    </div>

    <!-- PRESETS TAB -->
    <div id="tabContent-presets" class="tab-content space-y-2.5 max-h-52 overflow-y-auto pr-1">
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
        <button onclick="applyPreset('whiteVoidDark')" class="p-2.5 bg-white/5 border border-white/10 rounded-2xl hover:border-amber-400/50 transition text-left cursor-pointer">
          <span class="text-xs font-bold block text-white">White Void</span>
          <span class="text-[9px] text-slate-400">Black BG + Bright Waves</span>
        </button>
        <button onclick="applyPreset('goldDark')" class="p-2.5 bg-white/5 border border-white/10 rounded-2xl hover:border-amber-400/50 transition text-left cursor-pointer">
          <span class="text-xs font-bold block text-amber-300">Black & Gold</span>
          <span class="text-[9px] text-slate-400">Black BG + Gold Waves</span>
        </button>
        <button onclick="applyPreset('multiLightning')" class="p-2.5 bg-amber-400/10 border border-amber-400/40 rounded-2xl hover:border-amber-300 transition text-left cursor-pointer">
          <span class="text-xs font-bold block text-amber-200">⚡ Lightning</span>
          <span class="text-[9px] text-slate-300">Pro Effect</span>
        </button>
        <button onclick="applyPreset('silkSmoke')" class="p-2.5 bg-amber-400/10 border border-amber-400/40 rounded-2xl hover:border-amber-300 transition text-left cursor-pointer">
          <span class="text-xs font-bold block text-purple-300">💨 Smoke</span>
          <span class="text-[9px] text-slate-300">Pro Effect</span>
        </button>
      </div>
    </div>

    <!-- OPTICS TAB -->
    <div id="tabContent-optics" class="tab-content hidden space-y-2.5">
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div class="space-y-1"><div class="flex justify-between text-slate-300"><span>Speed</span></div><input type="range" id="sliderSpeed" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full" oninput="updateUniforms()"></div>
        <div class="space-y-1"><div class="flex justify-between text-slate-300"><span>Glow Density</span></div><input type="range" id="sliderGlow" min="0.5" max="8.0" step="0.2" value="2.0" class="w-full" oninput="updateUniforms()"></div>
      </div>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------
    // SAFE-MODE WEBGL SHADERS (Optimized for Mobile/Chrome GPU)
    // ---------------------------------------------------------
    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    // CHANGED u_mode FROM int TO float TO PREVENT MOBILE GPU CRASHES
    const fragmentShader = `
      precision mediump float;
      uniform vec2 u_resolution;
      uniform vec2 u_mouse;
      uniform float u_time;
      uniform float u_speed;
      uniform float u_glow;
      uniform float u_density;
      uniform float u_audioLevel;
      uniform float u_mode; 
      uniform vec3 u_colorA;
      uniform vec3 u_colorB;
      uniform vec3 u_colorC;

      varying vec2 vUv;

      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        f = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
      }

      void main() {
        vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        vec2 mouse = (u_mouse - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        float t = u_time * u_speed * 0.4;
        vec3 finalColor = u_colorA;

        // SAFE FLOAT COMPARISONS
        if (u_mode < 0.5) {
          float dist = length(st - mouse);
          float impact = smoothstep(0.45, 0.0, dist);
          st += normalize(st - mouse + 0.0001) * impact * 0.15;

          vec2 c = st * 6.5;
          float v = 0.0;
          for(int i = 1; i < 4; i++) {
            float fi = float(i);
            c += vec2(sin(fi * c.y + t), cos(fi * c.x - t));
            v += sin(c.x + c.y) / fi;
          }
          v = abs(v);
          float specular = pow(v, 3.5) * (u_glow * 0.4);
          float rim = pow(1.0 - v, 1.8);
          vec3 waveColor = mix(u_colorB, u_colorC, sin(v * 3.1415) * 0.5 + 0.5);
          finalColor = mix(u_colorA, waveColor + vec3(specular * 0.6), rim * 0.85);

        } else if (u_mode > 0.5 && u_mode < 1.5) {
          float totalBolt = 0.0;
          for(int b = 0; b < 4; b++) {
            float fb = float(b);
            vec2 p = st * 3.0 + vec2(sin(fb + t * 0.5), cos(fb * 0.5 - t * 0.3));
            float n = noise(p * 4.0 + t * 3.0 + fb);
            vec2 mouseDiff = st - mouse;
            float pull = smoothstep(0.6, 0.0, length(mouseDiff)) * 0.3;
            p += normalize(mouseDiff + 0.0001) * pull;
            float bolt = abs(p.x + sin(p.y * 5.0 + t * 4.0) * 0.4 + (n - 0.5) * 0.75);
            bolt = 0.012 / (bolt + 0.001);
            totalBolt += pow(bolt, 1.3);
          }
          finalColor = u_colorA + u_colorB * (totalBolt * (u_glow * 0.3));

        } else if (u_mode > 2.5) {
          vec2 q = st * 3.0;
          float f = noise(q + vec2(t * 0.2, t * 0.1));
          f += 0.5 * noise(q * 2.0 - vec2(t * 0.3));
          float dist = length(st - mouse);
          f += smoothstep(0.4, 0.0, dist) * 0.5;
          finalColor = mix(u_colorA, u_colorB, clamp(f * f * 1.5, 0.0, 1.0)) + u_colorC * (pow(f, 3.0) * (u_glow * 0.3));
        }

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    let scene, camera, renderer, material, mesh, uniforms;
    let targetMouse = new THREE.Vector2(0, 0), currentMouse = new THREE.Vector2(0, 0);

    function initEngine() {
      try {
        if (!window.THREE) throw new Error("Three.js engine failed to load from network.");

        const canvas = document.getElementById('webglCanvas');
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        uniforms = {
          u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
          u_mouse: { value: new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2) },
          u_time: { value: 0.0 },
          u_speed: { value: 1.0 },
          u_glow: { value: 2.0 },
          u_audioLevel: { value: 0.0 },
          u_mode: { value: 0.0 }, // MUST BE A DECIMAL FLOAT NOW
          u_colorA: { value: new THREE.Color('#000000') },
          u_colorB: { value: new THREE.Color('#ffffff') },
          u_colorC: { value: new THREE.Color('#e2e8f0') }
        };

        material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
        mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(mesh);

        renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);

        window.addEventListener('resize', () => {
          renderer.setSize(window.innerWidth, window.innerHeight);
          uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });
        window.addEventListener('pointermove', e => {
          targetMouse.x = e.clientX; targetMouse.y = window.innerHeight - e.clientY;
        });

        updateClock();
        animate(0);
      } catch (err) {
        alert("CRITICAL ENGINE ERROR: " + err.message + "\n\nIf you see this, your phone browser is blocking the 3D graphics.");
      }
    }

    function animate(timestamp) {
      requestAnimationFrame(animate);
      currentMouse.x += (targetMouse.x - currentMouse.x) * 0.1;
      currentMouse.y += (targetMouse.y - currentMouse.y) * 0.1;
      uniforms.u_mouse.value.set(currentMouse.x, currentMouse.y);
      uniforms.u_time.value = timestamp * 0.001;
      renderer.render(scene, camera);
      updateClock();
    }

    function updateUniforms() {
      uniforms.u_speed.value = parseFloat(document.getElementById('sliderSpeed').value);
      uniforms.u_glow.value = parseFloat(document.getElementById('sliderGlow').value);
    }

    function applyPreset(name) {
      const presets = {
        whiteVoidDark: { mode: 0.0, a: '#000000', b: '#ffffff', c: '#f1f5f9' },
        goldDark:      { mode: 0.0, a: '#000000', b: '#eab308', c: '#fef08a' },
        multiLightning:{ mode: 1.0, a: '#000000', b: '#38bdf8', c: '#ffffff' },
        silkSmoke:     { mode: 3.0, a: '#000000', b: '#c084fc', c: '#f472b6' },
      };
      const p = presets[name];
      if (p) {
        uniforms.u_mode.value = p.mode;
        uniforms.u_colorA.value.set(p.a);
        uniforms.u_colorB.value.set(p.b);
        uniforms.u_colorC.value.set(p.c);
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('bg-amber-400', 'text-black', 'font-bold');
        el.classList.add('text-slate-400');
      });
      document.getElementById('tabContent-' + tab).classList.remove('hidden');
      const active = document.getElementById('tabBtn-' + tab);
      active.classList.add('bg-amber-400', 'text-black', 'font-bold');
      active.classList.remove('text-slate-400');
    }

    function toggleOverlay() { document.getElementById('lockscreenOverlay').classList.toggle('opacity-0'); }
    function updateClock() {
      const now = new Date();
      document.getElementById('lockscreenClock').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    window.onload = initEngine;
  </script>
</body>
</html>
