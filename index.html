<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA • Interactive WebGL Lockscreen Studio</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js for GPU WebGL rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050608;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    .font-serif-slim {
      font-family: 'Playfair Display', serif;
    }

    .silver-metallic {
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 40%, #94a3b8 70%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-panel {
      background: rgba(10, 12, 18, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 99px; }

    input[type=range] {
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.1);
      height: 4px;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

  <!-- ================= 1. WEBGL CANVAS (FULLSCREEN GRAPHICS ENGINE) ================= -->
  <canvas id="webglCanvas" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></canvas>

  <!-- ================= 2. LOCKSCREEN UI OVERLAY LAYER ================= -->
  <div id="lockscreenOverlay" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-8 transition-opacity duration-500">
    
    <!-- Top Status Bar -->
    <div class="flex justify-between items-center text-xs font-semibold text-white/70 tracking-widest uppercase">
      <span id="liveTimeMini">00:00</span>
      <div class="flex items-center gap-1.5">
        <span class="text-[10px] bg-white/10 px-2 py-0.5 rounded-full border border-white/10">OLED 4K</span>
        <span>5G 🔋</span>
      </div>
    </div>

    <!-- Main Center Clock & Text -->
    <div class="text-center space-y-2 my-auto">
      <p id="lockscreenDate" class="text-xs md:text-sm font-medium tracking-[0.3em] uppercase text-white/80">LIVE GPU GENERATOR</p>
      <h1 id="lockscreenClock" class="text-7xl md:text-9xl font-light font-serif-slim tracking-tight text-white drop-shadow-2xl">12:45</h1>
      <p id="lockscreenCustomText" class="text-xs md:text-sm font-light tracking-[0.25em] text-white/60 uppercase max-w-md mx-auto pt-2">SILENT OBSIDIAN VOID</p>
    </div>

    <!-- Bottom Watermark -->
    <div class="text-center">
      <p class="text-[10px] tracking-[0.4em] text-white/30 uppercase font-mono">AURA • SHADER STUDIO GENERATOR</p>
    </div>
  </div>

  <!-- ================= 3. APP HEADER & CONTROLS ================= -->
  <header class="absolute top-4 left-4 right-4 z-20 flex justify-between items-center pointer-events-auto">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl glass-panel flex items-center justify-center border border-white/10 shadow-2xl">
        <svg class="w-5 h-5 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3v18M3 12h18"/>
        </svg>
      </div>
      <div>
        <h1 class="font-serif-slim text-lg tracking-[0.2em] font-medium uppercase silver-metallic">AURA</h1>
        <p class="text-[9px] text-slate-400 tracking-widest uppercase">REALTIME WEBGL STUDIO</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleLockscreenView()" class="glass-panel px-3.5 py-2 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:border-white/20 transition flex items-center gap-2">
        <span id="eyeIcon">👁️</span>
        <span class="hidden sm:inline">Toggle Overlay</span>
      </button>

      <button onclick="exportHighResWallpaper()" class="bg-gradient-to-r from-amber-500 to-amber-600 text-black font-extrabold px-4 py-2 rounded-xl text-xs hover:opacity-90 transition shadow-lg shadow-amber-500/20 flex items-center gap-1.5">
        <span>⚡</span>
        <span>Export 4K Wallpaper</span>
      </button>
    </div>
  </header>

  <!-- ================= 4. FLOATING CONTROL PANEL ================= -->
  <div id="controlPanel" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-[92%] max-w-xl glass-panel rounded-3xl p-5 shadow-2xl space-y-4 pointer-events-auto transition-all duration-300">
    
    <div class="flex items-center justify-between border-b border-white/10 pb-3">
      <div class="flex gap-2">
        <button onclick="switchTab('presets')" id="tabBtn-presets" class="tab-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white transition">Presets</button>
        <button onclick="switchTab('tweak')" id="tabBtn-tweak" class="tab-btn px-3 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition">Shader Controls</button>
        <button onclick="switchTab('text')" id="tabBtn-text" class="tab-btn px-3 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition">Typography</button>
      </div>
      <span class="text-[10px] text-slate-400 font-mono">Touch canvas to warp</span>
    </div>

    <!-- TAB 1: PRESETS -->
    <div id="tabContent-presets" class="tab-content grid grid-cols-4 gap-2">
      <button onclick="applyPreset('obsidian')" class="p-3 bg-black/50 border border-white/10 rounded-2xl hover:border-indigo-500 transition text-left group">
        <span class="text-xs font-bold block text-white group-hover:text-indigo-400">Obsidian</span>
        <span class="text-[9px] text-slate-400">Liquid Metal</span>
      </button>
      <button onclick="applyPreset('gold')" class="p-3 bg-black/50 border border-white/10 rounded-2xl hover:border-amber-500 transition text-left group">
        <span class="text-xs font-bold block text-white group-hover:text-amber-400">Amber VIP</span>
        <span class="text-[9px] text-slate-400">Molten Gold</span>
      </button>
      <button onclick="applyPreset('cyber')" class="p-3 bg-black/50 border border-white/10 rounded-2xl hover:border-cyan-500 transition text-left group">
        <span class="text-xs font-bold block text-white group-hover:text-cyan-400">Neon Prism</span>
        <span class="text-[9px] text-slate-400">Cyber Grid</span>
      </button>
      <button onclick="applyPreset('sad')" class="p-3 bg-black/50 border border-white/10 rounded-2xl hover:border-purple-500 transition text-left group">
        <span class="text-xs font-bold block text-white group-hover:text-purple-400">Deep Rain</span>
        <span class="text-[9px] text-slate-400">Moody Void</span>
      </button>
    </div>

    <!-- TAB 2: SHADER TWEAKS -->
    <div id="tabContent-tweak" class="tab-content hidden space-y-3">
      <div class="grid grid-cols-2 gap-4 text-xs">
        <div class="space-y-1">
          <div class="flex justify-between text-slate-300">
            <span>Flow Speed</span>
            <span id="speedVal">1.0</span>
          </div>
          <input type="range" id="sliderSpeed" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full" oninput="updateUniforms()">
        </div>

        <div class="space-y-1">
          <div class="flex justify-between text-slate-300">
            <span>Specularity / Glow</span>
            <span id="glowVal">2.0</span>
          </div>
          <input type="range" id="sliderGlow" min="0.5" max="5.0" step="0.1" value="2.0" class="w-full" oninput="updateUniforms()">
        </div>

        <div class="space-y-1">
          <div class="flex justify-between text-slate-300">
            <span>Fluid Density</span>
            <span id="densityVal">3.0</span>
          </div>
          <input type="range" id="sliderDensity" min="1.0" max="8.0" step="0.5" value="3.0" class="w-full" oninput="updateUniforms()">
        </div>

        <div class="space-y-1">
          <div class="flex justify-between text-slate-300">
            <span>Color Shift</span>
            <span id="colorVal">0.5</span>
          </div>
          <input type="range" id="sliderColor" min="0.0" max="1.0" step="0.05" value="0.5" class="w-full" oninput="updateUniforms()">
        </div>
      </div>
    </div>

    <!-- TAB 3: TYPOGRAPHY -->
    <div id="tabContent-text" class="tab-content hidden space-y-3">
      <div class="grid grid-cols-2 gap-3 text-xs">
        <input type="text" id="inputCustomText" placeholder="Custom Subtitle Text..." value="SILENT OBSIDIAN VOID" class="bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500" oninput="updateTextOverlay()">
        <input type="text" id="inputClockText" placeholder="Custom Clock (e.g. 00:00)" value="12:45" class="bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500" oninput="updateTextOverlay()">
      </div>
    </div>

  </div>

  <!-- ================= 5. THREE.JS GLSL SHADER ENGINE ================= -->
  <script>
    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      uniform vec2 u_resolution;
      uniform vec2 u_mouse;
      uniform float u_time;
      uniform float u_speed;
      uniform float u_glow;
      uniform float u_density;
      uniform float u_colorShift;
      uniform vec3 u_colorA;
      uniform vec3 u_colorB;

      varying vec2 vUv;

      void main() {
        vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        vec2 mouse = (u_mouse - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        
        float t = u_time * u_speed * 0.3;
        
        float distToMouse = length(st - mouse);
        float mouseImpact = smoothstep(0.45, 0.0, distToMouse);
        st += normalize(st - mouse + 0.0001) * mouseImpact * 0.2;

        vec2 c = st * u_density;
        float v = 0.0;
        
        for(int i = 1; i < 5; i++) {
          float fi = float(i);
          c += vec2(
            sin(fi * c.y + t + fi * 0.4),
            cos(fi * c.x - t + fi * 0.2)
          );
          v += sin(c.x + c.y) / fi;
        }

        v = abs(v);
        float specular = pow(v, 2.2) * u_glow;
        
        vec3 colA = mix(u_colorA, vec3(u_colorShift, 0.2, 0.8), 0.3);
        vec3 colB = mix(u_colorB, vec3(0.1, u_colorShift, 0.5), 0.3);
        
        vec3 finalColor = mix(colA, colB, clamp(v * 0.5, 0.0, 1.0));
        finalColor += vec3(specular * 0.5);

        float vignette = smoothstep(1.3, 0.2, length(st));
        finalColor *= vignette;

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    let scene, camera, renderer, material, mesh;
    let uniforms;
    let targetMouse = new THREE.Vector2(0, 0);
    let currentMouse = new THREE.Vector2(0, 0);

    function initEngine() {
      const canvas = document.getElementById('webglCanvas');
      
      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      uniforms = {
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_mouse: { value: new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2) },
        u_time: { value: 0.0 },
        u_speed: { value: 1.0 },
        u_glow: { value: 2.0 },
        u_density: { value: 3.0 },
        u_colorShift: { value: 0.5 },
        u_colorA: { value: new THREE.Color('#050608') },
        u_colorB: { value: new THREE.Color('#3b82f6') }
      };

      material = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: uniforms
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointermove', onPointerMove);

      updateLiveClock();
      setInterval(updateLiveClock, 1000);

      animate(0);
    }

    function animate(timestamp) {
      requestAnimationFrame(animate);

      currentMouse.x += (targetMouse.x - currentMouse.x) * 0.05;
      currentMouse.y += (targetMouse.y - currentMouse.y) * 0.05;
      uniforms.u_mouse.value.set(currentMouse.x, currentMouse.y);

      uniforms.u_time.value = timestamp * 0.001;
      renderer.render(scene, camera);
    }

    function onPointerMove(e) {
      targetMouse.x = e.clientX;
      targetMouse.y = window.innerHeight - e.clientY;
    }

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    }

    function updateUniforms() {
      const speed = parseFloat(document.getElementById('sliderSpeed').value);
      const glow = parseFloat(document.getElementById('sliderGlow').value);
      const density = parseFloat(document.getElementById('sliderDensity').value);
      const color = parseFloat(document.getElementById('sliderColor').value);

      document.getElementById('speedVal').innerText = speed.toFixed(1);
      document.getElementById('glowVal').innerText = glow.toFixed(1);
      document.getElementById('densityVal').innerText = density.toFixed(1);
      document.getElementById('colorVal').innerText = color.toFixed(2);

      uniforms.u_speed.value = speed;
      uniforms.u_glow.value = glow;
      uniforms.u_density.value = density;
      uniforms.u_colorShift.value = color;
    }

    function applyPreset(name) {
      if (name === 'obsidian') {
        uniforms.u_colorA.value.set('#050608');
        uniforms.u_colorB.value.set('#64748b');
        document.getElementById('sliderGlow').value = 2.0;
        document.getElementById('sliderDensity').value = 3.0;
        document.getElementById('sliderColor').value = 0.2;
      } else if (name === 'gold') {
        uniforms.u_colorA.value.set('#1a0c00');
        uniforms.u_colorB.value.set('#f59e0b');
        document.getElementById('sliderGlow').value = 3.5;
        document.getElementById('sliderDensity').value = 2.5;
        document.getElementById('sliderColor').value = 0.8;
      } else if (name === 'cyber') {
        uniforms.u_colorA.value.set('#030712');
        uniforms.u_colorB.value.set('#06b6d4');
        document.getElementById('sliderGlow').value = 3.0;
        document.getElementById('sliderDensity').value = 4.5;
        document.getElementById('sliderColor').value = 0.9;
      } else if (name === 'sad') {
        uniforms.u_colorA.value.set('#090514');
        uniforms.u_colorB.value.set('#8b5cf6');
        document.getElementById('sliderGlow').value = 1.5;
        document.getElementById('sliderDensity').value = 2.0;
        document.getElementById('sliderColor').value = 0.4;
      }
      updateUniforms();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('bg-indigo-600', 'text-white');
        el.classList.add('text-slate-400');
      });

      document.getElementById('tabContent-' + tabName).classList.remove('hidden');
      const activeBtn = document.getElementById('tabBtn-' + tabName);
      activeBtn.classList.add('bg-indigo-600', 'text-white');
      activeBtn.classList.remove('text-slate-400');
    }

    function updateTextOverlay() {
      const custom = document.getElementById('inputCustomText').value;
      const clock = document.getElementById('inputClockText').value;

      if(custom.trim() !== '') document.getElementById('lockscreenCustomText').innerText = custom;
      if(clock.trim() !== '') document.getElementById('lockscreenClock').innerText = clock;
    }

    function toggleLockscreenView() {
      const overlay = document.getElementById('lockscreenOverlay');
      overlay.classList.toggle('opacity-0');
    }

    function updateLiveClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('liveTimeMini').innerText = `${hours}:${mins}`;
    }

    function exportHighResWallpaper() {
      const exportWidth = 2160;
      const exportHeight = 3840;

      renderer.setSize(exportWidth, exportHeight);
      uniforms.u_resolution.value.set(exportWidth, exportHeight);
      renderer.render(scene, camera);

      const dataURL = renderer.domElement.toDataURL('image/png');

      const link = document.createElement('a');
      link.download = `AURA-4K-Wallpaper-${Date.now()}.png`;
      link.href = dataURL;
      link.click();

      onWindowResize();
    }

    window.onload = initEngine;
  </script>
</body>
</html>
